<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pengumuman Kelulusan</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  text-align: center;
  background: linear-gradient(135deg, #0f172a, #1e3a8a);
  color: white;
}

.container {
  max-width: 400px;
  margin: 50px auto;
  padding: 20px;
  background: rgba(255,255,255,0.05);
  border-radius: 15px;
}

input {
  width: 90%;
  padding: 10px;
  margin: 10px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #22c55e;
  color: white;
}

.hidden { display: none; }

.success { color: #22c55e; font-size: 24px; }
.fail { color: #ef4444; font-size: 24px; }

.logo { width: 80px; }

#countdown {
  font-size: 28px;
  margin-top: 100px;
}
</style>
</head>

<body>

<!-- COUNTDOWN -->
<!--<div id="countdownPage">
  <h1>Pengumuman Kelulusan</h1>
  <p>SMPN 1 Cigandamekar</p>
  <h2>Dibuka dalam:</h2>
  <div id="countdown"></div>
</div> -->

<!-- LOGIN -->
<div class="container hidden" id="loginPage">
  <img src="LOGO SMPN 1 CGM.png" class="logo">
  <h2>Cek Kelulusan</h2>

  <input id="nisn" placeholder="NISN">
  <input id="tgl" placeholder="Tanggal Lahir (dd/mm/yyyy)">

  <p id="captchaText"></p>
  <input id="captchaInput" placeholder="Jawaban captcha">

  <button onclick="login()">CEK</button>
  <p id="error"></p>
</div>

<!-- HASIL -->
<div class="container hidden" id="resultPage">
  <img src="LOGO SMPN 1 CGM.png" class="logo">
  <h2>Hasil Kelulusan</h2>

  <p id="nama"></p>
  <p id="nisnHasil"></p>

  <h1 id="status"></h1>

  <button onclick="location.reload()">Cek Lagi</button>
</div>

<script>
// ⏳ SET WAKTU BUKA (UBAH DISINI)
// const targetDate = new Date("2026-06-02T14:00:00");

// COUNTDOWN
const countdownEl = document.getElementById("countdown");

setInterval(() => {
  const now = new Date();
  const diff = targetDate - now;

  if (diff <= 0) {
    document.getElementById("countdownPage").classList.add("hidden");
    document.getElementById("loginPage").classList.remove("hidden");
    return;
  }

  const h = Math.floor(diff / (1000*60*60));
  const m = Math.floor((diff / (1000*60)) % 60);
  const s = Math.floor((diff / 1000) % 60);

  countdownEl.innerText = `${h} jam ${m} menit ${s} detik`;
}, 1000);


// CAPTCHA
let a,b;
function captcha(){
  a = Math.floor(Math.random()*10);
  b = Math.floor(Math.random()*10);
  document.getElementById("captchaText").innerText = `${a} + ${b} = ?`;
}
captcha();


// LOGIN
async function login(){
  const nisn = document.getElementById("nisn").value.trim();
  const tgl = document.getElementById("tgl").value.trim();
  const cap = document.getElementById("captchaInput").value.trim();

  if(cap != (a+b)){
    document.getElementById("error").innerText = "Captcha salah!";
    captcha();
    return;
  }

  const res = await fetch("data.json");
  const data = await res.json();

  const siswa = data.find(s => 
    s.NISN == nisn && s["Tanggal Lahir"] == tgl
  );

  if(!siswa){
    document.getElementById("error").innerText = "Data tidak ditemukan!";
    return;
  }

  tampilkan(siswa);
}


// HASIL
function tampilkan(s){
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("resultPage").classList.remove("hidden");

  document.getElementById("nama").innerText = s.Nama;
  document.getElementById("nisnHasil").innerText = "NISN: "+s.NISN;

  const st = document.getElementById("status");

  if(s.Status == "LULUS"){
    st.innerText = "🎉 SELAMAT ANDA LULUS 🎉";
    st.className = "success";

    confetti({
      particleCount:150,
      spread:100
    });

  }else{
    st.innerText = "❌ TIDAK LULUS";
    st.className = "fail";
  }
}
</script>

</body>
</html>
