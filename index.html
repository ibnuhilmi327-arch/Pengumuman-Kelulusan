<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengumuman Kelulusan SMPN 1 Cigandamekar</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e3a8a);
  color: white;
  text-align: center;
}

.container {
  max-width: 400px;
  margin: 50px auto;
  padding: 20px;
  background: rgba(255,255,255,0.05);
  border-radius: 15px;
  backdrop-filter: blur(10px);
}

input {
  width: 90%;
  padding: 10px;
  margin: 10px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  background: #22c55e;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #16a34a;
}

.hidden {
  display: none;
}

.success {
  color: #22c55e;
  font-size: 24px;
}

.fail {
  color: #ef4444;
  font-size: 24px;
}

.logo {
  width: 80px;
  margin-bottom: 10px;
}

.fade {
  animation: fadeIn 1s ease;
}

@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}
</style>
</head>

<body>

<div class="container" id="loginPage">
  <img src="logo.png" class="logo">
  <h2>Pengumuman Kelulusan</h2>
  <p>SMPN 1 Cigandamekar</p>

  <input type="text" id="nisn" placeholder="Masukkan NISN">
  <input type="text" id="tgl" placeholder="Tanggal Lahir (dd/mm/yyyy)">
  
  <p id="captchaText"></p>
  <input type="text" id="captchaInput" placeholder="Jawaban captcha">

  <button onclick="login()">Cek Kelulusan</button>
  <p id="error"></p>
</div>

<div class="container hidden fade" id="resultPage">
  <img src="logo.png" class="logo">
  <h2>Hasil Kelulusan</h2>

  <p id="nama"></p>
  <p id="nisnHasil"></p>

  <h1 id="status"></h1>

  <button onclick="location.reload()">Cek Lagi</button>
</div>

<script>
const sheetURL = "https://opensheet.elk.sh/1tjKy1ig7r-Ivd6xkgbkNamq7AM6849Eg5YxKdWqT7j8/Sheet1";

let captchaA, captchaB;

// generate captcha
function generateCaptcha() {
  captchaA = Math.floor(Math.random() * 10);
  captchaB = Math.floor(Math.random() * 10);
  document.getElementById("captchaText").innerText = 
    `Berapa ${captchaA} + ${captchaB} ?`;
}

generateCaptcha();

async function login() {
  const nisn = document.getElementById("nisn").value.trim();
  const tgl = document.getElementById("tgl").value.trim();
  const captchaInput = document.getElementById("captchaInput").value.trim();
  const error = document.getElementById("error");

  error.innerText = "";

  if (captchaInput != (captchaA + captchaB)) {
    error.innerText = "Captcha salah!";
    generateCaptcha();
    return;
  }

  try {
    const res = await fetch(sheetURL);
    const data = await res.json();

    const siswa = data.find(s => 
      s.NISN == nisn && s["Tanggal Lahir"] == tgl
    );

    if (!siswa) {
      error.innerText = "Data tidak ditemukan!";
      return;
    }

    tampilkanHasil(siswa);

  } catch (err) {
    error.innerText = "Gagal ambil data!";
  }
}

function tampilkanHasil(siswa) {
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("resultPage").classList.remove("hidden");

  document.getElementById("nama").innerText = siswa.Nama;
  document.getElementById("nisnHasil").innerText = "NISN: " + siswa.NISN;

  const statusEl = document.getElementById("status");

  if (siswa.Status.toUpperCase() == "LULUS") {
    statusEl.innerText = "🎉 SELAMAT ANDA LULUS 🎉";
    statusEl.className = "success";
  } else {
    statusEl.innerText = "❌ ANDA TIDAK LULUS";
    statusEl.className = "fail";
  }
}
</script>

</body>
</html>
